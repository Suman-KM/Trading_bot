[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-system"
version = "0.1.0"
description = "AI Autonomous Trading System - Member 2 Research, ML, and Signal Engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
data = [
    "numpy",
    "pandas",
    "pyarrow",
]
ml = [
    "scikit-learn",
    "xgboost",
]
research = [
    "matplotlib",
    "scipy",
    "jupyter",
]
dashboard = [
    "streamlit",
]
api = [
    "fastapi",
    "pydantic",
    "httpx",
]
test = [
    "pytest",
]
dev = [
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
